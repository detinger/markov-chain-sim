<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Model, simulate, and understand discrete-time Markov chains." />
    <title>Markov Chain Simulator</title>
    <script>
      // Resolve the theme before first paint (STYLE.md §12.1).
      (function () {
        try {
          var p = localStorage.getItem('markov-simulator:theme');
          var dark = p === 'dark' || ((p === null || p === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
